pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
 	default_type  application/octet-stream;

    # Run as non-root: redirect all writable paths to /tmp
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    server {
        listen 8080;

        root /usr/share/nginx/html;

        # Security headers. The app ships its own CSP via a <meta> tag, so the
        # header-level CSP only carries frame-ancestors (which is ignored in
        # <meta> and must be set as a header).
        # NOTE: nginx add_header directives are NOT inherited into location
        # blocks that declare their own add_header — repeat them there.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        # Enable gzip compression for all files with type below
        gzip on;
        gzip_vary on;           # tells proxies to cache both gzipped and non-gzipped versions of a file
        gzip_disable "msie6";   # disable gzip for IE 6...
        gzip_comp_level 6;
        gzip_types text/css application/javascript;

        # Entry points must always be revalidated, otherwise clients may keep
        # using a stale index.html/config.json after a deployment.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }

        location = /config.json {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }

        # Vite emits content-hashed filenames under /assets/, safe to cache
        # for a long time. (^~ so the svg/ttf regex below cannot override it.)
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }

        # Custom rule to return 404 for SVG and TTF files if not found
        location ~* \.(svg|ttf)$ {
            try_files $uri =404;  # If the SVG or TTF file doesn't exist, return 404
        }

        # Default fallback rule to return index.html for other missing files
        location / {
            try_files $uri $uri/ /index.html;  # If any file is not found, serve index.html
        }
    }
}
