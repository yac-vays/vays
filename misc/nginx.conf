pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
 	default_type  application/octet-stream;

    # Run as non-root: redirect all writable paths to /tmp
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Do not advertise the nginx version (Server header, error pages)
    server_tokens off;

    server {
        listen 8080;

        root /usr/share/nginx/html;

        # Security headers. The app ships its own CSP via a <meta> tag; the
        # same policy is sent as a header with the document (index.html, see
        # there). Everything else only carries frame-ancestors (which is
        # ignored in <meta> and must be set as a header).
        # NOTE: nginx add_header directives are NOT inherited into location
        # blocks that declare their own add_header — repeat them there.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        # Browsers only honour it over HTTPS (the TLS-terminating proxy passes
        # it on); one year, this host only.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        # Enable gzip compression for all files with type below
        gzip on;
        gzip_vary on;           # tells proxies to cache both gzipped and non-gzipped versions of a file
        gzip_disable "msie6";   # disable gzip for IE 6...
        gzip_comp_level 6;
        gzip_types text/css application/javascript;

        # Entry points must always be revalidated, otherwise clients may keep
        # using a stale index.html/config.json after a deployment.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            # The Content-Security-Policy header of the document: the app's
            # full policy derived from config.json at container start
            # (misc/csp.js), or just frame-ancestors if that failed.
            include /tmp/csp/index.conf;
        }

        location = /config.json {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }

        # The favicon is materialised from config.json at container start
        # (misc/favicon.js) - Safari ignores favicons set from JavaScript. The
        # file keeps its real extension there, so the matching try_files entry
        # determines the Content-Type; without one, the built-in default from
        # the html root is served.
        location = /favicon.svg {
            root /tmp/branding;
            try_files /favicon.svg /favicon.png /favicon.ico /favicon.gif /favicon.jpg /favicon.webp @builtin_favicon;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            # The configured icon may be any SVG: when opened as a document it
            # must not run scripts or load anything.
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
        }

        location @builtin_favicon {
            try_files /favicon.svg =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
        }

        # Vite emits content-hashed filenames under /assets/, safe to cache
        # for a long time. (^~ so the svg/ttf regex below cannot override it.)
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }

        # Custom rule to return 404 for SVG and TTF files if not found
        location ~* \.(svg|ttf)$ {
            try_files $uri =404;  # If the SVG or TTF file doesn't exist, return 404
        }

        # Default fallback rule to return index.html for other missing files
        location / {
            try_files $uri $uri/ /index.html;  # If any file is not found, serve index.html
        }
    }
}
